name: Build VST3 + Instalador (Windows)
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item -Recurse "build/RepartoVocalSuite_artefacts/Release/VST3/*" out/
          Copy-Item "build/RepartoVocalSuite_artefacts/Release/Standalone/*.exe" out/
          Get-ChildItem -Recurse out | Select-Object -First 30 FullName
      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss
      - uses: actions/upload-artifact@v4
        with:
          name: RepartoVocalSuite-Setup
          path: dist/RepartoVocalSuite-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: RepartoVocalSuite-VST3-suelto
          path: out
